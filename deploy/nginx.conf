# Configuration nginx du conteneur site-web (montée dans /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Variantes WebP : le nom change avec l'image d'origine, cache long sans risque.
    location /content/variants/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
