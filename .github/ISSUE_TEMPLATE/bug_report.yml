name: Bug du site
description: Affichage, navigation, recherche ou construction incorrects
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous à la place ?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page concernée
      placeholder: https://zakmaf.net/...
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir ...
        2. Cliquer sur ...
        3. Constater ...
  - type: input
    id: environnement
    attributes:
      label: Navigateur, appareil, thème clair ou sombre
  - type: input
    id: version
    attributes:
      label: Version du site
      description: Affichée en bas du pied de page (ex. v1.0.0).
