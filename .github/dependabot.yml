version: 2
updates:
  # Correctifs et versions mineures regroupés en une PR ; chaque version majeure a sa propre PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
  # Image de base : empreinte et correctifs suivis ; le passage à une autre version majeure
  # de Node (LTS suivante) se fait à la main.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
