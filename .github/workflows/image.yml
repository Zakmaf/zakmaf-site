name: image
# PR et main : vérification (secrets, construction du site, construction de l'image).
# Tag vX.Y.Z poussé : mêmes vérifications, publication de l'image sur GHCR, puis création
# de la release GitHub à partir de docs/RELEASES.md.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]
permissions: {}
# Une PR mise à jour annule son run précédent ; les runs sur main vont jusqu'au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secrets:
    # Sur un tag, le code a déjà été analysé à son arrivée sur main (et un push de tag ne
    # porte aucun commit à analyser).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Tag : il doit correspondre à la version de package.json (vX.Y.Z).
      - if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG différent de la version de package.json ($expected)"
            exit 1
          fi
      - run: npm ci
      # Sans GHOST_API_URL, la construction se fait hors ligne avec des articles fictifs.
      - run: npm run build
  build:
    needs: [secrets, check]
    # « secrets » est ignoré sur un tag : on continue si check a réussi.
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.secrets.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Publication uniquement sur un tag de version ; ailleurs, l'image est construite sans être poussée.
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest, vMAJEUR, vMAJEUR.MINEUR et vMAJEUR.MINEUR.PATCH ; pas de latest pour une préversion.
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: build
    # Condition explicite : « secrets », sauté sur un tag, ferait sinon sauter ce job aussi.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Notes : section « ## vX.Y.Z - date » de docs/RELEASES.md, jusqu'à la version suivante.
      - run: |
          awk -v t="## $TAG " 'index($0, t) == 1 { f = 1; next } f && /^## v/ { exit } f' docs/RELEASES.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Aucune entrée pour $TAG dans docs/RELEASES.md"
            exit 1
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md $flags
